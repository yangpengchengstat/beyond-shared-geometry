name: CPU and publication release

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portable-release:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e '.[test,analysis,prospective]'
      - name: CPU scientific and release contracts
        run: PYTHONPATH=src python tests/run_cpu_checks.py
      - name: Prospective CPU contracts
        run: PYTHONPATH=src python tests/run_prospective_checks.py
      - name: Characterization source and private-import contracts
        run: |
          python scripts/verify_characterization.py
          python -m pytest -q studies/characterization_v1/tests
      - name: Frozen evidence and publication surface
        run: |
          python scripts/verify_frozen.py
          python scripts/verify_prospective.py
          python scripts/check_release.py
      - name: Build deterministic source and Overleaf archives
        run: python scripts/package_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: release-python-${{ matrix.python-version }}
          path: dist/

  local-transformer-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e '.[test,analysis,prospective,gpu]'
      - name: Tiny random local models; no pretrained downloads
        env:
          HF_HUB_OFFLINE: '1'
          TRANSFORMERS_OFFLINE: '1'
        run: PYTHONPATH=src python tests/run_prospective_checks.py
